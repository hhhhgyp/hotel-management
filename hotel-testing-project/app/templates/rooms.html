<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>房间管理 - 酒店管理系统</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
    <h1>房间管理</h1>
    <div class="user-info">{{ session.username }} · <a href="{{ url_for('logout') }}">退出</a></div>
</header>

<div class="nav">
    <a href="{{ url_for('rooms') }}" class="active">房间管理</a>
    <a href="{{ url_for('room_types') }}">房型管理</a>
    <a href="{{ url_for('bookings') }}">预订管理</a>
</div>

<div class="container">
    {% with messages = get_flashed_messages() %}
        {% if messages %}<div class="flash" id="flash-msg">{{ messages[-1] }}</div>{% endif %}
    {% endwith %}

    <form method="get" action="{{ url_for('rooms') }}" class="search-bar">
        <input type="text" id="q" name="q" value="{{ q }}" placeholder="按房号搜索">
        <select id="status" name="status">
            <option value="">全部状态</option>
            {% for s in all_statuses %}
                <option value="{{ s }}" {% if status == s %}selected{% endif %}>{{ s }}</option>
            {% endfor %}
        </select>
        <select id="type" name="type">
            <option value="">全部房型</option>
            {% for t in room_types %}
                <option value="{{ t }}" {% if type == t %}selected{% endif %}>{{ t }}</option>
            {% endfor %}
        </select>
        <button type="submit" id="search-btn">查询</button>
        <a href="{{ url_for('room_new') }}" id="add-room-btn" class="btn">添加房间</a>
    </form>

    <table id="room-table">
        <thead>
            <tr><th>ID</th><th>房号</th><th>房型</th><th>楼层</th><th>状态</th><th>操作</th></tr>
        </thead>
        <tbody>
        {% for r in rooms %}
            <tr data-id="{{ r.id }}">
                <td>{{ r.id }}</td>
                <td class="room-number">{{ r.number }}</td>
                <td>{{ r.type }}</td>
                <td>{{ r.floor }}</td>
                <td><span class="room-status">{{ r.status }}</span></td>
                <td>
                    <a href="{{ url_for('room_edit', room_id=r.id) }}">编辑</a>
                    <form method="post" action="{{ url_for('room_delete', room_id=r.id) }}" class="inline-form"
                          onsubmit="return confirm('确定删除该房间？')">
                        <button type="submit" class="delete-btn">删除</button>
                    </form>
                </td>
            </tr>
        {% else %}
            <tr><td colspan="6" class="empty">暂无房间</td></tr>
        {% endfor %}
        </tbody>
    </table>
</div>
</body>
</html>
